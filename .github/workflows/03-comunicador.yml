name: Comunicador de la legion 

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envia el mensaje?"
        required: true
        type: choice
        options: 
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      mesnaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"


      prioridad:
        description: "Nivel de Prioridad"
        required: true
        type: choice
        options: 
          - 🟢Normal
          - 🟡Alta
          - 🔴Crítica
jobs:
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Imprimir Inputs
        run: |
          echo "Inputs:"
          echo ""
          echo "Villano: {{inputs.villano}}"
          echo "Nivel: {{inputs.prioridad}}"
          echo "Mensaje: {{inputs.mensaje}}"
